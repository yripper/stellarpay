    - generic [ref=f3e113]:
      - heading "What actually happens on the wire" [level=3] [ref=f3e114]
      - list [ref=f3e115]:
        - listitem [ref=f3e116]: An agent requests a paid route. It gets a 402 with a machine-readable challenge — price, asset, recipient, network.
        - listitem [ref=f3e117]:
          - text: The client checks the price against its spend limits and refuses if it's over budget. This happens
          - emphasis [ref=f3e118]: before
          - text: anything is signed.
        - listitem [ref=f3e119]: It signs and settles on Stellar — via the facilitator for x402, or directly for MPP, with gas optionally sponsored by the seller.
        - listitem [ref=f3e120]: It retries automatically with proof of payment. Your calling code just sees a 200.
        - listitem [ref=f3e121]:
          - text: The seller's
          - code [ref=f3e122]: onPayment
          - text: hook fires with a receipt carrying the real transaction hash — verifiable on any block explorer.
